<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Field logger"><meta name="theme-color" content="#1f3a5f"><title>Field logger</title></head><body>
<style>
/* Layout: one-screen tablet tool — header bar, tabbed workspace; Live = floorplan left, logging rail right. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#e4e9e7; --ink:#17212b; --muted:#566670; --rule:#c9d3d0;
  --accent:#c2410c; --accent-ink:#ffffff; --zone:#1d5f8a; --open:#6b4fa3;
  --ok:#2f7d4f; --warn:#9a6300; --danger:#b42318;
  --map-bg:#f7f9f8; --map-zone:#dbe3e0; --map-edge:#8a9aa1;
  --f-sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172026; --surface-2:#1f2a31; --ink:#e6ecea; --muted:#94a4ac; --rule:#2d3b43;
  --accent:#f07a3e; --accent-ink:#1a0d05; --zone:#5aa7d6; --open:#a88ee3;
  --ok:#5cc28a; --warn:#e3a72f; --danger:#f06a5f;
  --map-bg:#121b20; --map-zone:#24323b; --map-edge:#5c707a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --surface-2:#1f2a31; --ink:#e6ecea; --muted:#94a4ac; --rule:#2d3b43;
  --accent:#f07a3e; --accent-ink:#1a0d05; --zone:#5aa7d6; --open:#a88ee3;
  --ok:#5cc28a; --warn:#e3a72f; --danger:#f06a5f;
  --map-bg:#121b20; --map-zone:#24323b; --map-edge:#5c707a; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--zone);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:4px}
.brand b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.status{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--surface-2);font-size:12px;font-family:var(--f-mono);white-space:nowrap}
.chip.zone{background:color-mix(in srgb,var(--zone) 18%,transparent);color:var(--zone);font-weight:600}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.clock{font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--r)}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;overflow:auto}
.pad{padding-block:20px;padding-inline:16px;max-width:1100px;margin:0 auto}

/* generic controls */
.btn{border:1px solid var(--rule);background:var(--surface);padding:9px 14px;border-radius:var(--r);font-weight:600;font-size:14px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.field textarea{min-height:70px;resize:vertical}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
h2{font-size:20px;margin:0 0 4px;text-wrap:balance}
h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 18px;max-width:68ch}
#tab-session .sess{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start;max-width:1400px;margin:0 auto}
@media (max-width:900px){#tab-session .sess{grid-template-columns:1fr}}
#tab-session .panel{padding:12px 14px}
#tab-session h3{margin:0 0 8px}
#tab-session .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#tab-session .field input,#tab-session .field select{min-height:38px;padding:6px 8px}
#tab-session .lbl{font-size:10px;margin-bottom:3px;min-height:16px;display:flex;align-items:center}
#tab-session .inl{display:inline-flex;align-items:center;gap:4px;margin-left:8px;text-transform:none;letter-spacing:0;font-weight:500}
#tab-session .inl input{width:14px;height:14px;min-height:0;margin:0}
#tab-session .cklist{display:flex;flex-direction:column;gap:2px}
#tab-session .ck{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.3;padding:4px 0;cursor:pointer}
#tab-session .ck input{width:20px;height:20px;min-height:0;flex:none;margin:0}
#tab-session .ck .quote{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#tab-session .row .note{font-size:12px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--muted)}
.draft{font-size:10px;font-family:var(--f-mono);color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}

/* live */
.live{display:grid;grid-template-columns:minmax(0,1fr) 340px;flex:1;min-height:0}
#tab-live[hidden]{display:none!important}
.steps{display:flex;gap:4px;overflow-x:auto;padding-block:8px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--rule);flex:0 0 auto}
.steps:empty{display:none}
.st{flex:1 1 auto;min-width:max-content;overflow:hidden;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:5px 7px;text-align:left;font-size:12.5px;font-weight:600;line-height:1.15;min-height:44px;white-space:nowrap;text-overflow:ellipsis;display:flex;flex-direction:column;justify-content:center;gap:2px}
.st small{font-family:var(--f-mono);font-size:9.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{overflow:hidden;text-overflow:ellipsis}
.st.small{flex-grow:.6}
.st.done{color:var(--muted);background:var(--surface-2);border-color:transparent}
.st.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st.cur small{color:var(--bg);opacity:.75}
.st.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.st.due{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--map-bg);border-right:1px solid var(--rule)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-size:18px;font-weight:600}
.maphint{position:absolute;left:10px;bottom:10px;right:60px;z-index:2;font-size:12px;color:var(--muted);font-family:var(--f-mono);pointer-events:none}
.rail{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.rail-scroll{flex:1;min-height:0;overflow:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:14px}
.sec h3{margin-bottom:6px}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ph{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:7px 8px;text-align:left;font-size:13px;font-weight:600;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.ph small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.ph.done{color:var(--muted)}
.ph.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ph.cur small{color:var(--bg);opacity:.75}
.ph.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.timer{font-family:var(--f-mono);font-size:13px;padding:7px 10px;border-radius:7px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.timer.go{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.task{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:8px;font-size:13px;font-weight:500;min-height:46px;text-align:left;line-height:1.2}
.task.on{background:color-mix(in srgb,var(--zone) 16%,var(--surface));border-color:var(--zone);color:var(--zone);font-weight:600}
.task .grp{display:block;font-size:10px;font-family:var(--f-mono);color:var(--muted);font-weight:400}
.bigbtn{width:100%;min-height:52px;border-radius:9px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-weight:700;font-size:15px}
.inits{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.inits button{border:1px solid var(--rule);background:var(--surface);border-radius:7px;min-height:42px;font-size:12px;font-weight:600;padding:4px}
.inits-head{font-size:12px;color:var(--accent);font-weight:600;margin-top:8px}
.probes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.probes button{border:1px solid var(--rule);background:var(--surface);border-radius:7px;min-height:44px;font-weight:700;font-size:13px}
.probes button.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.probes button.due{border-color:var(--accent);color:var(--accent)}
.log{font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:2px}
.log div{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--rule)}
.log div.void{opacity:.4;text-decoration:line-through}
.log .t{color:var(--muted)}
.log .x{border:0;background:transparent;color:var(--muted);font-size:14px;width:28px;height:24px}
.railfoot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--rule);background:var(--surface)}
.railfoot .btn{flex:1}
.notebox{display:flex;gap:6px}
.notebox input{flex:1;min-width:0;min-height:42px;border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px;background:var(--surface)}
.blocker{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 85%,transparent);z-index:5;padding:16px}
.blocker .panel{max-width:420px;text-align:center}

/* svg map */
.z{fill:var(--map-zone);stroke:var(--map-edge);stroke-width:1.2;vector-effect:non-scaling-stroke}
.z.cur{fill:color-mix(in srgb,var(--zone) 30%,var(--map-zone));stroke:var(--zone);stroke-width:2.5}
.z.sel{stroke:var(--accent);stroke-width:3}
.z.room{fill:#cfd4d8;stroke:#9aa3aa;stroke-dasharray:4 3}
.has-img .z.room{fill-opacity:.45}
.z.room.cur{fill:color-mix(in srgb,var(--zone) 30%,#cfd4d8);stroke:var(--zone);stroke-dasharray:none}
.zl.room{font-weight:500;font-style:italic;fill:var(--muted)}
#sheetCard .sub{max-width:none}
.has-img .z{fill-opacity:.35}
.has-img .z.cur{fill-opacity:.5}
.zl{fill:var(--ink);font-family:var(--f-sans);font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:var(--map-bg);stroke-width:3px;stroke-linejoin:round}
.zl.cur{fill:var(--zone)}
.ln .hit{stroke:transparent;stroke-width:34;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:stroke}
.ln .vis{stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
.ln.threshold .vis{stroke:var(--accent)}
.ln.open .vis{stroke:var(--open);stroke-dasharray:7 6}
.timer.warn{border-color:var(--danger,#c0392b)!important;color:var(--danger,#c0392b)}
.ln.dim .vis{opacity:.28}
.ln.off .vis{opacity:.12}
.ln.off .hit{pointer-events:none}
.ln.walkdoor .vis{stroke:#d2461e;stroke-width:13;animation:wdp 1.2s ease-in-out infinite}
@keyframes wdp{50%{stroke-width:7}}
.ln.active .vis{stroke-width:9}
.ln.sel .vis{stroke-width:10;filter:drop-shadow(0 0 3px var(--accent))}
.ln.flash .vis{stroke:var(--ok)}
.ln.bad .vis{stroke:var(--danger)}
.ll{font-family:var(--f-mono);font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:var(--map-bg);stroke-width:3px}
.ll.threshold{fill:var(--accent)} .ll.open{fill:var(--open)}
.ll.dim{opacity:.35}
.draftln{fill:none;stroke:var(--warn);stroke-width:2.5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.draftpt{fill:var(--warn);stroke:var(--map-bg);stroke-width:2;vector-effect:non-scaling-stroke}

/* geometry editor */
.geo{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.tools button{border:1px solid var(--rule);background:var(--surface);border-radius:7px;min-height:44px;font-weight:600;font-size:13px;padding:4px 6px}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.help{font-size:13px;padding:8px 10px;border-radius:7px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink)}
.items{font-size:13px;display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
.items button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:5px}
.items button:hover{background:var(--surface-2)}
.items .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.issue{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:600;font-size:13px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* export */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.arch{display:flex;flex-direction:column;gap:8px}
.arch .item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--rule);border-radius:8px}
.arch .item .meta{flex:1;min-width:180px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

/* overlays */
#sync{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
#sync.flip{background:#fff;color:#000}
#sync .n{font-family:var(--f-mono);font-size:min(16vw,140px);font-weight:600;letter-spacing:.04em}
#sync .t{font-family:var(--f-mono);font-size:min(9vw,72px);font-variant-numeric:tabular-nums}
#sync p{font-size:16px;opacity:.75;margin:0}
#sheet{position:fixed;inset:0;z-index:40;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center}
#sheet.locked{background:rgb(0 0 0/.85)}
#sheet.locked .card{max-height:100%;height:100%;border-radius:0;width:100%}
.obsx{margin-left:auto;font-size:12px;opacity:.55}
#sheet .card{background:var(--surface);width:min(860px,100%);max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px 22px}
.q{padding:12px 0;border-bottom:1px solid var(--rule)}
.q p{margin:0 0 8px;font-weight:600}
.scale{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.scale button{min-width:0;min-height:44px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:0 2px}
.scale button.on{background:var(--zone);color:var(--bg);border-color:var(--zone)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.scale button.na{font-family:var(--f-sans);font-weight:500;color:var(--muted)}
.scale button.na.on{color:var(--bg)}
.kss{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.kss button{text-align:center;min-height:64px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 3px;font-size:10.5px;line-height:1.2;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.kss button b{font-family:var(--f-mono);font-size:13px}
.kss button.on{background:var(--zone);color:var(--bg);border-color:var(--zone)}
.zrow{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--rule)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0/.25)}
#toast.warn{background:var(--warn);color:#fff}
#toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;min-height:32px}

@media (max-width:860px){
  .live,.geo{grid-template-columns:1fr;grid-template-rows:minmax(300px,55%) minmax(0,1fr)}
  .mapwrap{border-right:0;border-bottom:1px solid var(--rule)}
  .tabs button{padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><b>Field logger</b><span>shadowing</span></div>
    <div class="status" id="status"></div>
    <div class="clock" id="clock">--:--:--</div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="session" aria-selected="true">Session</button>
      <button role="tab" data-tab="live" aria-selected="false">Live</button>
      <button role="tab" data-tab="export" aria-selected="false">Export</button>
      <button role="tab" data-tab="geometry" aria-selected="false">Geometry</button>
    </nav>
  </header>
  <main>
    <section class="tab" id="tab-session"></section>
    <section class="tab" id="tab-live" hidden style="display:flex;flex-direction:column">
      <nav class="steps" id="steps" aria-label="Session steps"></nav>
      <div class="live">
        <div class="mapwrap" id="liveWrap">
          <svg id="liveMap" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="mapctl"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="fit" aria-label="Fit map">⤢</button></div>
          <div class="maphint" id="liveHint"></div>
          <div class="blocker" id="liveBlock" hidden><div class="panel"><h2>No session running</h2><p class="sub" style="margin:8px 0 14px">Fill in the session details and start the session first.</p><button class="btn primary" data-goto="session">Go to session</button></div></div>
        </div>
        <aside class="rail">
          <div class="rail-scroll" id="rail"></div>
          <div class="railfoot">
            <button class="btn" id="btnSync">Extra sync</button>
            <button class="btn" id="btnFix">Correct zone</button>
            <button class="btn" id="btnUndo">Undo</button>
          </div>
        </aside>

    ${G.draft.length ? `<div class="row" style="margin-top:6px">${G.tool === "zone" ? `<button class="btn sm primary" id="gFinish">Finish area</button>` : ""}<button class="btn sm" id="gCancel">Cancel</button></div>` : ""}</div>
    ${selHtml}
    <div class="sec"><h3>Check (${issues.length})</h3>${issues.length ? `<div class="items">${issues.map(i => `<span class="issue">${esc(i)}</span>`).join("")}</div>` : `<p class="note" style="margin:0">Every line has an area on both sides and every area can be entered.</p>`}</div>
    <div class="sec"><h3>Doors and boundaries</h3><div class="items">${geo.lines.map(l => `<button data-pick-line="${l.id}"><span>${esc(l.name)} <span class="k">${l.type === "threshold" ? "door" : "open"}</span></span><span class="k">${esc(zoneLabel(l.zones[0]))} | ${esc(zoneLabel(l.zones[1]))}</span></button>`).join("") || `<span class="note">None yet.</span>`}</div></div>
    <div class="sec"><h3>Areas</h3><div class="items">${geo.zones.map(z => `<button data-pick-zone="${z.id}"><span>${esc(disp(z.name))}</span><span class="k">${z.points.length} pts</span></button>`).join("")}</div></div>`;
  if (G.naming) { const el = $("#znName"); if (el) { el.focus(); el.select(); } G.naming = null; }
}
$("#geoRail").addEventListener("click", e => {
  const t = e.target;
  const tl = t.closest("[data-tool]"); if (tl) { G.tool = tl.dataset.tool; G.draft = []; G.hover = null; return renderGeo(); }
  const pl = t.closest("[data-pick-line]"); if (pl) { G.sel = { kind: "line", id: pl.dataset.pickLine }; G.tool = "select"; return renderGeo(); }
  const pz = t.closest("[data-pick-zone]"); if (pz) { G.sel = { kind: "zone", id: pz.dataset.pickZone }; G.tool = "select"; return renderGeo(); }
  const lt = t.closest("[data-ltype]"); if (lt) { const l = geo.lines.find(x => x.id === G.sel.id); l.type = lt.dataset.ltype; geoChanged(); return renderGeo(); }
  if (t.closest("#gFinish")) return finishZone();
  if (t.closest("#gCancel")) { G.draft = []; return renderGeo(); }
  if (t.closest("#gLoad")) return $("#fileGeo").click();
  if (t.closest("#gImg")) return $("#fileImg").click();
  if (t.closest("#gSave")) { const name = (geo.name || "geometry").replace(/\W+/g, "_").toLowerCase(); return saveFile(`field-logger_geometry_${name}.json`, JSON.stringify({ ...geo, schema: "field-logger-geometry/1", signature: geoSignature(), exportedAt: new Date().toISOString() })); }
  if (t.closest("#gDefault")) { geo = structuredClone(DEFAULT_GEO); saveGeo(); G.sel = null; fitVB("geo"); fitVB("live"); renderAll(); toast("Built-in floor plan restored"); return; }
  if (t.closest("#lnDetect")) { const l = geo.lines.find(x => x.id === G.sel.id); l.zones = detectSides(l); geoChanged(); return renderGeo(); }
  if (t.closest("#lnDel")) { geo.lines = geo.lines.filter(x => x.id !== G.sel.id); G.sel = null; geoChanged(); return renderGeo(); }
  if (t.closest("#znDel")) { const id = G.sel.id; geo.zones = geo.zones.filter(x => x.id !== id); geo.lines.forEach(l => l.zones = l.zones.map(z => z === id ? "" : z)); G.sel = null; geoChanged(); return renderGeo(); }
});
$("#geoRail").addEventListener("change", e => {
  const t = e.target; if (!G.sel) return;
  if (G.sel.kind === "line") { const l = geo.lines.find(x => x.id === G.sel.id); if (t.id === "lnName") l.name = t.value.trim() || l.name; if (t.id === "lnA") l.zones[0] = t.value; if (t.id === "lnB") l.zones[1] = t.value; }
  if (G.sel.kind === "zone" && t.id === "znName") { const z = zoneById(G.sel.id); z.name = t.value.trim() || z.name; }
  geoChanged(); renderGeo();
});
attachGestures($("#geoMap"), "geo", geoTap, e => { if (G.draft.length && G.tool !== "select") { G.hover = snap(svgPoint($("#geoMap"), e.clientX, e.clientY)); renderMap("geo"); } });

function loadImageDims(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = rej; i.src = url; }); }
$("#fileGeo").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.zones)) throw new Error("no zones");
    const img = d.image || null;
    // A loaded file must not be able to add markup or fetch anything from the network.
    if (img && !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(img)) throw new Error("image must be embedded");
    const num = v => typeof v === "number" && Number.isFinite(v);
    const key = v => typeof v === "string" && /^[\w:-]+$/.test(v);
    const pointOk = p => p && num(p.x) && num(p.y);
    if (![d.width, d.height].every(v => v == null || num(v))) throw new Error("bad size");
    if (!d.zones.every(z => (!z.id || key(z.id)) && (z.points || []).every(pointOk))) throw new Error("bad area");
    if (!(d.lines || []).every(l => (!l.id || key(l.id)) && pointOk(l.a) && pointOk(l.b) && (l.zones || []).every(z => z === "" || key(z)))) throw new Error("bad line");
    let w = d.width, h = d.height;
    if (img && (!w || !h)) { const dims = await loadImageDims(img); w = dims.w; h = dims.h; }
    const zones = d.zones.map(z => ({ id: z.id || uid("Z"), name: z.name || "Area", ...(["room", "passage"].includes(z.kind) ? { kind: z.kind } : {}), points: (z.points || []).map(p => ({ x: +p.x, y: +p.y })) }));
    if (!w || !h) { const xs = zones.flatMap(z => z.points.map(p => p.x)), ys = zones.flatMap(z => z.points.map(p => p.y)); w = Math.max(...xs) + 20; h = Math.max(...ys) + 20; }
    geo = { schema: "field-logger-geometry/1", metres_per_px: d.metres_per_px || null, name: d.name || f.name.replace(/\.json$/, ""), example: false, width: w, height: h, image: img, zones,
      lines: (d.lines || []).map(l => ({ id: l.id || uid("L"), name: l.name, type: l.type === "open" ? "open" : "threshold", a: l.a, b: l.b, zones: l.zones || ["", ""] })) };
    saveGeo(); G.sel = null; G.draft = []; fitVB("geo"); fitVB("live"); renderAll();
    toast(`Loaded ${zones.length} areas and ${geo.lines.length} lines${d.lines ? "" : ". Now draw the doors and open boundaries."}`);
  } catch (err) { toast("That file is not a geometry or zone file this tool can read.", "warn"); }
});
$("#fileImg").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    const dims = await loadImageDims(r.result);
    const hadZones = geo.zones.length && !geo.example;
    if (!hadZones) geo = { schema: "field-logger-geometry/1", name: f.name.replace(/\.\w+$/, ""), example: false, width: dims.w, height: dims.h, image: r.result, zones: [], lines: [] };
    else { geo.image = r.result; if (!geo.width) { geo.width = dims.w; geo.height = dims.h; } }
    saveGeo(); fitVB("geo"); fitVB("live"); renderAll(); toast(hadZones ? "Floorplan image added under the existing areas" : "Floorplan loaded. Draw the areas next.");
  };
  r.readAsDataURL(f);
});

/* ---------------- Tabs ---------------- */
function showTab(id) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  ["session", "live", "export", "geometry"].forEach(t => $("#tab-" + t).hidden = t !== id);
  try { sessionStorage.setItem("field_logger_tab", id); } catch {}
  if (id === "session") renderSession();
  if (id === "live") { fitVB("live"); renderLive(); }
  if (id === "export") { confirmKey = null; renderExport(); }
  if (id === "geometry") { fitVB("geo"); renderGeo(); }
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
document.addEventListener("click", e => { const g = e.target.closest("[data-goto]"); if (g) showTab(g.dataset.goto); });
function renderAll() { renderStatus(); const cur = document.querySelector('.tabs [aria-selected="true"]')?.dataset.tab || "session"; showTab(cur); }

let startTab = "session"; try { startTab = sessionStorage.getItem("field_logger_tab") || (S.started && !S.ended ? "live" : "session"); } catch {}
showTab(startTab);
$("#clock").textContent = hms(Date.now());
if (S.started && !S.ended) requestWake();
})();
</script>
